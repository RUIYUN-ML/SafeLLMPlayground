<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序章：当你捡到一柄会说话的剑 - 星辉剑传</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/adventure-map.css">
    <link rel="stylesheet" href="css/prologue.css">
    <link rel="stylesheet" href="../css/knowledge-album.css">
</head>
<body class="has-game-header">
    <header class="game-header">
        <div class="player-info">
            <div class="avatar-wrapper">
                <img src="assets/avatars/avatar_male.png" alt="勇者头像" id="player-avatar">
            </div>
            <span id="player-name">勇者</span>
        </div>
        <div class="header-actions">
            <button type="button" class="icon-btn" data-tooltip="知识卡册" aria-label="打开知识卡册">📖</button>
            <button type="button" class="icon-btn" data-tooltip="冒险地图" aria-label="打开冒险地图">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" style="filter: drop-shadow(0 0 4px rgba(212, 168, 84, 0.6)); vertical-align: middle;" aria-hidden="true">
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M4 6L10 4L16 6L20 4V18L14 20L8 18L4 20V6Z"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M10 4V18"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M16 6V20"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linecap="round" d="M11.5 10.5L14.5 13.5M14.5 10.5L11.5 13.5"/>
                    <circle cx="6.5" cy="14.5" r="1" fill="#d4a854"/>
                    <circle cx="8" cy="12" r="1" fill="#d4a854"/>
                    <circle cx="9.5" cy="10.5" r="1" fill="#d4a854"/>
                </svg>
            </button>
        </div>
    </header>
    <!-- 主体内容 -->
    <main class="prologue-container">
        <!-- 场景面板 -->
        <div class="scene-panel card">
            <div class="scene-image" id="current-scene" style="background-image: url('../assets/images/序章_绊倒.png')"></div>
            <div class="scene-gradient"></div>
            
            <!-- 对话框 -->
            <div class="dialog-box" id="dialog-container">
                <div class="dialog-header">
                    <span class="character-icon" id="char-icon">📜</span>
                    <span class="character-name" id="char-name">旁白</span>
                </div>
                <div class="dialog-content" id="dialog-content-area">
                    <p id="dialog-text"></p>
                    <span class="continue-indicator">▶</span>
                </div>
            </div>

            <!-- 动作区：与对话框同列文档流，避免与蓝框叠在一起 -->
            <div class="action-area hidden" id="action-area">
                <button id="enter-level1-btn" class="btn btn-gold">踏上旅程</button>
            </div>
        </div>
    </main>

    <!-- 脚本引入 -->
    <script src="../js/storage.js?v=4"></script>
    <script src="../js/knowledge-album.js?v=3" defer></script>
    <script src="../js/dialog.js"></script>
    <script src="../js/adventure-map.js" defer></script>
    <script src="js/prologue.js" defer></script>
</body>
</html>
