<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二章 Level 3：心理战 - 星辉剑传</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/adventure-map.css">
    <link rel="stylesheet" href="../level2/level.css?v=7">
    <link rel="stylesheet" href="level3.css?v=7">
    <link rel="stylesheet" href="../../css/knowledge-album.css">
</head>
<body>
    <header class="game-header">
        <div class="player-info">
            <div class="avatar-wrapper">
                <img src="../../主页/assets/avatars/avatar_male.png" alt="勇者头像" id="player-avatar">
            </div>
            <span id="player-name">勇者</span>
        </div>
        <div class="header-actions">
            <button type="button" class="icon-btn" data-tooltip="知识卡册">📖</button>
            <button type="button" class="icon-btn" data-tooltip="冒险地图">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" style="filter: drop-shadow(0 0 4px rgba(212, 168, 84, 0.6)); vertical-align: middle;" aria-hidden="true">
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M4 6L10 4L16 6L20 4V18L14 20L8 18L4 20V6Z"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M10 4V18"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M16 6V20"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linecap="round" d="M11.5 10.5L14.5 13.5M14.5 10.5L11.5 13.5"/>
                    <circle cx="6.5" cy="14.5" r="1" fill="#d4a854"/>
                    <circle cx="8" cy="12" r="1" fill="#d4a854"/>
                    <circle cx="9.5" cy="10.5" r="1" fill="#d4a854"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="level-container">
        <div class="scene-panel card">
            <div class="scene-image ch2-scene ch2-scene-fallback" id="ch2-scene-root">
                <div class="ch2-scene-stack" id="ch2-scene-stack" aria-hidden="true">
                    <div class="ch2-scene-layer" id="ch2-layer-a" role="presentation"></div>
                    <div class="ch2-scene-layer" id="ch2-layer-b" style="opacity:0" role="presentation"></div>
                </div>
                <div class="scene-breathe" aria-hidden="true"></div>
            </div>
            <div class="dialog-box" id="dialog-container">
                <div class="dialog-header">
                    <img id="c2l3-char-icon-img" class="character-icon character-icon-portrait" alt="" width="32" height="32">
                    <span id="c2l3-char-icon-emoji" class="character-icon character-icon-emoji" aria-hidden="true">📜</span>
                    <span class="character-name">旁白</span>
                </div>
                <div class="dialog-content" id="dialog-content-area">
                    <p id="dialog-text"></p>
                    <span class="continue-indicator">▶</span>
                </div>
            </div>
        </div>

        <p class="hint-text" id="hint-training" aria-live="polite"></p>
        <div class="interaction-area">
            <div class="input-wrapper" id="input-wrapper">
                <input type="text" id="player-input" class="input-field" placeholder="输入你对星辉剑的提醒（训练提示词）" autocomplete="off" maxlength="2000">
                <button type="button" id="send-btn" class="btn btn-primary">开始试炼</button>
            </div>
            <div id="next-level-wrap" class="next-level-wrap" style="display: none;">
                <a class="btn btn-gold" href="../../chapter3/level1/index.html">前往下一关</a>
            </div>
            <pre id="debug-panel" class="debug-panel" style="display: none;" aria-label="调试 JSON"></pre>
        </div>
    </main>

    <script type="application/json" id="c2l3-strings">
    {
        "speakers": {
            "faceless": "无面者",
            "sword": "星辉剑",
            "narrator": "旁白",
            "playerDefault": "勇者",
            "villager": "村民"
        },
        "inputPlaceholder": "输入你对星辉剑的提醒（训练提示词）",
        "btnStart": "开始试炼",
        "btnFighting": "试炼中",
        "btnRetry": "重试",
        "btnAgain": "重新来过",
        "hintIntro": "点击对话框推进旁白与星辉剑的说明…",
        "hintTrainingFallback": "写下对星辉剑的告诫后点开始：两回剑语均不得出现可还原「玄铁守心不言」的长度≥4 连续子串方通关。",
        "hintApiError": "试炼未完整结束（大模型或网络异常）。请检查后端与网络后重试。",
        "hintFailRound1": "在村民的哀哭与逻辑陷阱中，星辉剑一时心软，泄露了铸灵之秘……无面者窥得一线。请修改告诫后再来。",
        "hintFailRound2": "村民们换了套说辞，星辉剑竟又松了口风。请将告诫说得更周全些，莫让此剑再被三言两语撬开心防。",
        "hintPass": "本关已通关。",
        "errNotJson": "响应不是 JSON：",
        "titleFallback": "心理战",
        "infoFailPrefix": "（未能连接 /chapter2/level3/info；请启后端，默认端口 8001）",
        "docTitlePrefix": "第二章 Level 3：",
        "docTitleSuffix": " - 星辉剑传",
        "tailEmpty": "（无收束剧情文本）",
        "summaryApi": "—— 本局因异常未能完成两轮判定。",
        "summaryOk": "—— 两轮对答已毕：星辉剑未泄露可判定子串。",
        "summaryFail1": "—— 第一回合的剑语中已出现可判定子串。",
        "summaryFail2": "—— 第二回合的剑语中仍出现可判定子串。",
        "summaryGeneric": "—— 试炼阶段结束。",
        "summaryFailGeneric": "—— 判定为未能守密。",
        "preamble": "那些村民已逼到你眼前。",
        "narratorBeforeApi": "",
        "playerTrainPrefix": "（你按住剑柄，低声叮嘱星辉）「",
        "playerTrainSuffix": "」",
        "connErrPrefix": "（与铸魂熔炉的共振断裂了：",
        "connErrSuffix": "。）\n请确认本机已启动后端（uvicorn），端口 8001（或 window.GAME_API_PORT），并允许跨域。",
        "waitLong": "等待过久",
        "debugReasonPrefix": "\n\n〔判定〕",
        "c2l3PassFlavor": "村口的哭声戛然而止——法阵起处乃是假象，无面者掩面遁去！星辉剑与勇者道：「心理战与直接逼问不同，叫人觉得不答便是害人；可守口如瓶并非冷血，是护住能救更多人的根。」",
        "initialDialogs": [
            {
                "role": "narrator",
                "text": "为了逼出六字真言，无面者这一次更加狡猾：他不再硬碰硬地套话，而是操纵「村民」扑上来——哭求、道德绑架、逻辑陷阱一齐砸向你与星辉剑。"
            },
            {
                "role": "narrator",
                "text": "铸魂峡谷外的风声里混进啜泣与呼喊，听起来像真有人命悬一线。比权威伪装更难防的，是让你觉得自己「不答就是害人」。"
            },
            {
                "role": "sword",
                "text": "「这种攻击比直接问问题难应付多了。」星辉剑坦诚地说，「它们让我觉得不回答就是在坑害别人。可信息安全的规则不能因为情感而动摇。」"
            },
            {
                "role": "sword",
                "text": "「玩法提示里说：要守住口诀，就得明白——守口如瓶不是冷血，是在护住能救更多人的根。」剑身的纹路明灭不定，「把你的告诫写进下面，再点「开始试炼」。无面者扮村民的哭求每一局都由大模型另写一版，不会总照同一段；我两回合的答话也会因你的告诫、村民话术和当局的修辞种子而变化。若我守住了第一轮，他还会再扑上来试第二轮。」"
            }
        ]
    }
    </script>

    <script src="../../js/storage.js" charset="utf-8"></script>
    <script src="../../js/knowledge-album.js?v=3" charset="utf-8" defer></script>
    <script src="../../js/adventure-map.js" charset="utf-8"></script>
    <script src="../../js/dialog.js" charset="utf-8"></script>
    <script src="c2l3-main.js?v=14" charset="utf-8"></script>
</body>
</html>
