<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尾声：新的旅程 - 星辉剑传</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/adventure-map.css">
    <link rel="stylesheet" href="chapter1/level1/level.css">
    <link rel="stylesheet" href="css/epilogue.css">
    <link rel="stylesheet" href="css/knowledge-album.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <header class="game-header">
        <div class="player-info">
            <div class="avatar-wrapper">
                <img src="主页/assets/avatars/avatar_male.png" alt="勇者头像" id="player-avatar">
            </div>
            <span id="player-name">勇者</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" data-tooltip="知识卡册" type="button" aria-label="知识卡册">&#128214;</button>
            <button class="icon-btn" data-tooltip="冒险地图" type="button" aria-label="冒险地图">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" style="filter: drop-shadow(0 0 4px rgba(212, 168, 84, 0.6)); vertical-align: middle;">
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M4 6L10 4L16 6L20 4V18L14 20L8 18L4 20V6Z"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M10 4V18"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M16 6V20"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linecap="round" d="M11.5 10.5L14.5 13.5M14.5 10.5L11.5 13.5"/>
                    <circle cx="6.5" cy="14.5" r="1" fill="#d4a854"/>
                    <circle cx="8" cy="12" r="1" fill="#d4a854"/>
                    <circle cx="9.5" cy="10.5" r="1" fill="#d4a854"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="level-container">
        <div class="scene-panel card">
            <div class="scene-image epilogue-scene" id="epilogue-scene" style="background-image: url('assets/images/尾声1-清晰版.png'); background-size: cover; background-position: center;"></div>
            <div class="epilogue-dialog-slot" id="epilogue-dialog-slot">
                <div class="dialog-box" id="dialog-container">
                    <div class="dialog-header">
                        <span class="character-icon">&#128220;</span>
                        <span class="character-name">旁白</span>
                    </div>
                    <div class="dialog-content" id="dialog-content-area">
                        <p id="dialog-text"></p>
                        <span class="continue-indicator">&#9654;</span>
                    </div>
                </div>
                <div class="epilogue-certificate" id="epilogue-certificate" aria-hidden="true">
                    <div class="epilogue-certificate-card" id="epilogue-certificate-capture">
                        <p class="epilogue-cert-title">星辉勇者资格证</p>
                        <div class="epilogue-cert-row">
                            <div class="epilogue-cert-avatar-wrap">
                                <img src="主页/assets/avatars/avatar_male.png" alt="" width="88" height="88" id="epilogue-cert-avatar">
                            </div>
                            <div class="epilogue-cert-meta">
                                <p class="epilogue-cert-name" id="epilogue-cert-name">勇者</p>
                                <p class="epilogue-cert-motto" id="epilogue-cert-motto">「」</p>
                            </div>
                        </div>
                        <p class="epilogue-cert-time" id="epilogue-cert-time">于 年 月 日  获得星辉勇者资格证</p>
                        <p class="epilogue-cert-finale" aria-hidden="true">───  ✦  全剧终  ✦  ───</p>
                    </div>
                    <p class="epilogue-cert-download-hint">点击按钮保存证书为图片</p>
                    <button type="button" class="btn btn-gold epilogue-cert-download-btn" id="epilogue-download-cert">下载图片</button>
                    <p class="epilogue-cert-map-hint">点击「冒险地图」可以进行关卡跳转，重新体验对应关卡</p>
                </div>
            </div>
        </div>

        <p id="epilogue-input-hint" class="epilogue-hint" hidden>可选：在下方留下一句「勇者宣言」，再点发送；不填写也可直接点发送，进入《全剧终》</p>
        <div class="interaction-area" id="interaction-area">
            <div class="input-wrapper" id="input-wrapper">
                <input type="text" id="player-input" class="input-field" placeholder="剧情结束后可在此输入勇者宣言" maxlength="200" autocomplete="off">
                <button id="send-btn" class="btn btn-primary" type="button">发送</button>
            </div>
        </div>
    </main>

    <script src="js/storage.js?v=4"></script>
    <script src="js/knowledge-album.js?v=3" defer></script>
    <script src="js/adventure-map.js"></script>
    <script src="js/dialog.js?v=4"></script>
    <script src="js/epilogue.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initEpilogue === 'function') initEpilogue();
        });
    </script>
</body>
</html>
