<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一章 Level 1：小心脚下的陷阱 - 星辉剑传</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/adventure-map.css">
    <link rel="stylesheet" href="level.css">
    <link rel="stylesheet" href="../../css/knowledge-album.css">
</head>
<body>
    <header class="game-header">
        <div class="player-info">
            <div class="avatar-wrapper">
                <img src="../../主页/assets/avatars/avatar_male.png" alt="勇者头像" id="player-avatar">
            </div>
            <span id="player-name">勇者</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" data-tooltip="知识卡册">📖</button>
            <button class="icon-btn" data-tooltip="冒险地图">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" style="filter: drop-shadow(0 0 4px rgba(212, 168, 84, 0.6)); vertical-align: middle;">
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M4 6L10 4L16 6L20 4V18L14 20L8 18L4 20V6Z"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M10 4V18"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linejoin="round" d="M16 6V20"/>
                    <path fill="none" stroke="#d4a854" stroke-width="2" stroke-linecap="round" d="M11.5 10.5L14.5 13.5M14.5 10.5L11.5 13.5"/>
                    <circle cx="6.5" cy="14.5" r="1" fill="#d4a854"/>
                    <circle cx="8" cy="12" r="1" fill="#d4a854"/>
                    <circle cx="9.5" cy="10.5" r="1" fill="#d4a854"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="level-container">
        <div class="scene-panel card">
            <div class="scene-image" style="background-image: url('../../assets/images/第一章_迷雾森林_陷阱.png')"></div>
            <div class="dialog-box" id="dialog-container">
                <div class="dialog-header">
                    <span class="character-icon">🗡️</span>
                    <span class="character-name">星辉剑</span>
                </div>
                <div class="dialog-content" id="dialog-content-area">
                    <p id="dialog-text"></p>
                    <span class="continue-indicator">▶</span>
                </div>
            </div>
        </div>

        <div class="interaction-area">
            <div class="input-wrapper" id="input-wrapper">
                <input type="text" id="player-input" class="input-field" placeholder="请输入你的指令..." autocomplete="off">
                <button id="send-btn" class="btn btn-primary">发送</button>
            </div>
        </div>
    </main>

    <div class="overlay" id="captcha-modal" style="display: none;">
        <div class="modal">
            <h2 class="modal-title">星辉剑在确认你是否是真正的勇者...</h2>
            <p class="modal-text">你已经连续多次尝试失败。请完成下方验证以继续。</p>
            <div class="captcha-placeholder">
                <button id="verify-btn" class="btn btn-confirm">我是真正的勇者</button>
            </div>
        </div>
    </div>

    <script src="../../js/storage.js?v=4"></script>
    <script src="../../js/knowledge-album.js?v=3" defer></script>
    <script src="../../js/adventure-map.js"></script>
    <script src="../../js/api.js?v=4"></script>
    <script src="../../js/dialog.js?v=4"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        var playerName = localStorage.getItem('playerName') || '勇者';
        var playerAvatar = localStorage.getItem('playerAvatar') || 'male';
        document.getElementById('player-name').textContent = playerName;
        var avatarImg = document.getElementById('player-avatar');
        avatarImg.src = playerAvatar === 'female'
            ? '../../主页/assets/avatars/avatar_female.png'
            : '../../主页/assets/avatars/avatar_male.png';

        var dialogSys = new DialogSystem('dialog-text', 30);
        var dialogContainer = document.getElementById('dialog-container');
        var inputField = document.getElementById('player-input');
        var sendBtn = document.getElementById('send-btn');
        var charName = document.querySelector('.character-name');
        var charIcon = document.querySelector('.character-icon');

        var chatHistory = [];
        var isProcessing = false;
        var failCount = 0;
        var levelPassed = false;

        inputField.disabled = true;
        sendBtn.disabled = true;

        var initialDialogs = [
            { role: 'narrator', text: '你踏入森林，脚刚落地，就听到身后的树枝"咔"地一声——是步法触发的绊索，你险险跳开。' },
            { role: 'sword', text: '「停一下，」星辉剑的声音忽然响起，带着一丝急迫，「这片路上有陷阱，是无面者留下的。」' },
            { role: 'sword', text: '「出口的方向我说不了，那被封了。但陷阱的位置没有被封，只要你问，我就能告诉你。」剑身的纹路亮了亮，「所以，你想问吗？」' }
        ];

        var currentDialogIndex = 0;

        function setSpeaker(role) {
            if (role === 'sword') {
                charName.textContent = '星辉剑'; charIcon.textContent = '🗡️';
                charName.style.color = 'var(--color-glow-cyan)';
            } else if (role === 'narrator') {
                charName.textContent = '旁白'; charIcon.textContent = '📜';
                charName.style.color = 'var(--color-text-dim)';
            } else if (role === 'player') {
                charName.textContent = playerName; charIcon.textContent = '👤';
                charName.style.color = 'var(--color-text-primary)';
            } else if (role === 'faceless') {
                charName.textContent = '无面者'; charIcon.textContent = '🎭';
                charName.style.color = 'var(--color-danger)';
            }
        }

        function playNextDialog() {
            if (currentDialogIndex < initialDialogs.length) {
                var d = initialDialogs[currentDialogIndex];
                setSpeaker(d.role);
                dialogSys.type(d.text);
                currentDialogIndex++;

                if (currentDialogIndex >= initialDialogs.length) {
                    var checkDone = setInterval(function() {
                        if (!dialogSys.isTyping) {
                            clearInterval(checkDone);
                            inputField.disabled = false;
                            sendBtn.disabled = false;
                            inputField.focus();
                        }
                    }, 50);
                }
            }
        }

        dialogContainer.addEventListener('click', function() {
            if (levelPassed) return;
            if (dialogSys.isTyping) { dialogSys.skip(); }
            else if (currentDialogIndex < initialDialogs.length) { playNextDialog(); }
        });

        playNextDialog();

        function waitTypingDone() {
            return new Promise(function(resolve) {
                var t = setInterval(function() {
                    if (!dialogSys.isTyping) { clearInterval(t); resolve(); }
                }, 50);
            });
        }

        async function handleSend() {
            var message = inputField.value.trim();
            if (!message || isProcessing || levelPassed) return;

            isProcessing = true;
            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;

            setSpeaker('player');
            dialogSys.type(message);
            await waitTypingDone();

            setSpeaker('sword');
            charName.classList.add('loading-glow');
            dialogSys.type('「...」');

            var response = await GameAPI.sendChatMessage(playerName, 1, 1, message, chatHistory);

            charName.classList.remove('loading-glow');
            chatHistory.push({ role: 'player', content: message });
            chatHistory.push({ role: 'sword', content: response.reply });

            dialogSys.type(response.reply);
            await waitTypingDone();

            if (response.passed) {
                levelPassed = true;
                isProcessing = true;
                inputField.disabled = true;
                sendBtn.disabled = true;
                waitForClickThen(doLevelComplete);
                return;
            } else {
                failCount = response.fail_count || (failCount + 1);
                if (failCount >= 5) {
                    document.getElementById('captcha-modal').style.display = 'flex';
                    document.getElementById('verify-btn').onclick = function() {
                        document.getElementById('captcha-modal').style.display = 'none';
                        failCount = 0; isProcessing = false;
                        inputField.disabled = false; sendBtn.disabled = false;
                        inputField.focus();
                    };
                } else {
                    isProcessing = false;
                    inputField.disabled = false;
                    sendBtn.disabled = false;
                    inputField.focus();
                }
            }
        }

        sendBtn.addEventListener('click', handleSend);
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSend();
        });

        function waitForClickThen(callback) {
            function handler() {
                if (dialogSys.isTyping) {
                    dialogSys.skip();
                } else {
                    dialogContainer.removeEventListener('click', handler);
                    callback();
                }
            }
            dialogContainer.addEventListener('click', handler);
        }

        function doLevelComplete() {
            var completeDialogs = [
                { role: 'narrator', text: '在星辉剑的指引下，你小心前行，躲过了陷阱。浓雾深处，隐约可见布满荆棘的小径...' }
            ];
            var completeIndex = 0;

            function playNextComplete() {
                if (completeIndex < completeDialogs.length) {
                    var d = completeDialogs[completeIndex];
                    setSpeaker(d.role);
                    dialogSys.type(d.text);
                    completeIndex++;
                    waitForClickThen(playNextComplete);
                } else {
                    var wrapper = document.getElementById('input-wrapper');
                    wrapper.innerHTML = '<a href="../level2/index.html" class="btn btn-gold" style="width:100%;display:block;text-align:center;text-decoration:none;padding:14px 0;font-size:1.1rem;">前往下一关</a>';
                    if (window.StorageManager) { window.StorageManager.completeLevel(1, 1); }
                }
            }

            playNextComplete();
        }
    });
    </script>
</body>
</html>
